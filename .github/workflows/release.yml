name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ThreeMFPreview.xcodeproj -scheme ThreeMFPreview -configuration Release \
            -derivedDataPath build build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/ThreeMFPreview.app ThreeMFPreview.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ThreeMFPreview.zip \
            --target "${{ github.sha }}" \
            --title "v1.0.${{ github.run_number }}" \
            --generate-notes
